name: Validation

on:
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v6
      - name: Run package tests
        run: |
          mkdir -p "$PWD/.tmp"
          export TMPDIR="$PWD/.tmp"
          swift test --package-path Packages/GitHub --jobs 2
          swift test --package-path Packages/VirtualMachine --jobs 2
